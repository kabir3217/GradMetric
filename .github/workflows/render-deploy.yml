name: CI - Build & Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Student Performance Model
          file: ./Student Performance Model/Dockerfile
          push: false
          tags: user/gradmetric-backend:latest

      - name: Trigger Render Deploy (optional)
        if: secrets.RENDER_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-Type: application/json' "${{ secrets.RENDER_WEBHOOK_URL }}"
